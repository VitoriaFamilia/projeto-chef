<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Guia Gastronômico IA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1> Guia Gastronômico </h1>
<p>O que vamos comer hoje?</p>
<div class="form-group">
<label>Como você está se sentindo?</label>
<select id="humor">
<option value="cansado"> Cansado (Preciso de conforto)</
option>
<option value="aventureiro"> Aventureiro (Algo novo)</
option>
<option value="radiante"> Radiante (Para celebrar)</
option>
<option value="focado"> Focado (Algo leve)</option>
</select>
</div>
<div class="form-group">
<label>Quanto quer investir?</label>

<select id="orcamento">
<option value="economico">$ Econômico</option>
<option value="moderado">$$ Moderado</option>
<option value="luxo">$$$ Luxo</option>
</select>
</div>
<div class="form-group">
<label>Restrição Alimentar:</label>
<select id="restricao">
<option value="nenhuma">Nenhuma</option>
<option value="vegano">Vegano</option>
<option value="sem-gluten">Sem Glúten</option>
<option value="sem-lactose">Sem Lactose</option>
</select>
</div>
<button onclick="gerarSugestao()">Gerar Sugestão Mágica </button>
<div id="resultado" class="result-area">
<p>Sua sugestão aparecerá aqui...</p>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

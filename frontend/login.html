<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Humor - Entrar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #fff3e0, #ffebee);
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #d32f2f;
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .logo p {
            color: #757575;
            font-size: .9rem;
            line-height: 1.4;
        }

        .grupo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ffcc80;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            background: #fffde7;
        }

        input:focus {
            border-color: #e65100;
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f57c00, #d32f2f);
            color: white;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .mensagem {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: .9rem;
            display: none;
        }

        .mensagem.erro {
            display: block;
            background: #ffebee;
            color: #c62828;
        }

        .mensagem.sucesso {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            font-size: .9rem;
            color: #757575;
        }

        .login-link a {
            color: #d32f2f;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <h1>🍽️ Food Humor</h1>
            <p>Entre com sua conta para continuar</p>
        </div>

        <form id="login-form">
            <!-- CPF -->
            <div class="grupo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" autocomplete="username" required>
            </div>

            <!-- SENHA -->
            <div class="grupo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>
            </div>

            <button type="submit" id="btn-entrar">Entrar</button>
        </form>

        <div id="mensagem" class="mensagem"></div>

        <div class="login-link">
            Não possui uma conta?
            <a href="cadastro.html">Criar conta</a>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api";
        const TOKEN_KEY = "foodhumor_token";
        const USER_KEY = "foodhumor_usuario";

        // Se já possuir token, redireciona para evitar reautenticação desnecessária
        window.addEventListener("DOMContentLoaded", () => {
            const tokenSalvo = localStorage.getItem(TOKEN_KEY);
            const usuarioSalvo = JSON.parse(localStorage.getItem(USER_KEY) || "{}");
            if (tokenSalvo) {
                if (usuarioSalvo.perfilCompleto) {
                    window.location.href = "index.html";
                } else {
                    window.location.href = "perfil.html";
                }
            }
        });

        const form = document.getElementById("login-form");
        const cpfInput = document.getElementById("cpf");
        const senhaInput = document.getElementById("senha");
        const mensagem = document.getElementById("mensagem");
        const botao = document.getElementById("btn-entrar");

        // Máscara CPF
        cpfInput.addEventListener("input", () => {
            let valor = cpfInput.value.replace(/\D/g, "").substring(0, 11);
            if (valor.length > 9) {
                valor = valor.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
            } else if (valor.length > 6) {
                valor = valor.replace(/^(\d{3})(\d{3})(\d{1,3})$/, "$1.$2.$3");
            } else if (valor.length > 3) {
                valor = valor.replace(/^(\d{3})(\d{1,3})$/, "$1.$2");
            }
            cpfInput.value = valor;
        });

        // Ação de Login
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const cpf = cpfInput.value.trim();
            const senha = senhaInput.value;

            botao.disabled = true;
            botao.innerText = "Entrando...";

            try {
                const resposta = await fetch(`${API_URL}/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ cpf, senha })
                });

                const data = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(data.erro || "Credenciais inválidas.");
                }

                localStorage.setItem(TOKEN_KEY, data.token);
                localStorage.setItem(USER_KEY, JSON.stringify(data.usuario));

                mostrarMensagem("Login realizado com sucesso!", "sucesso");

                setTimeout(() => {
                    if (data.usuario.perfilCompleto) {
                        window.location.href = "index.html";
                    } else {
                        window.location.href = "perfil.html";
                    }
                }, 800);

            } catch (erro) {
                console.error("❌ Erro no login:", erro);
                mostrarMensagem(erro.message, "erro");
                botao.disabled = false;
                botao.innerText = "Entrar";
            }
        });

        function mostrarMensagem(texto, tipo) {
            mensagem.className = `mensagem ${tipo}`;
            mensagem.innerText = texto;
        }
    </script>
</body>

</html>
